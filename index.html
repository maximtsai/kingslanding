<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hero TD -- P5</title>

<!-- Vendored, not from a CDN. A game loop should not have a network dependency,
     and this pins the exact three.js the art was authored against (r128). -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script>
  // Set before the first paint; module boot builds the full scene before the HUD
  // exists, which is too late to correct an initially untransformed stage.
  document.documentElement.style.setProperty('--stage-scale',
    Math.min(window.innerWidth / 720, window.innerHeight / 1280));
</script>

<style>
  :root { --ink:#162228; --paper:#e7eeef; --gold:#f2c14e; --red:#c2352f; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0e1416;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }

  /* TDD 14: target format is portrait 720x1280. The stage is that size and is
     scaled to fit, so desktop development and a real phone frame the same. */
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 720px; height: 1280px; transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
    background: #6eb4c4; overflow: hidden;
  }
  #viewport { position: absolute; inset: 0; }

  #loading {
    position: absolute; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: #172a31; color: #f6f7f3; pointer-events: auto;
    transition: opacity .32s ease, visibility .32s step-end;
  }
  #loading.ready { opacity: 0; visibility: hidden; pointer-events: none; }
  #loading-mark { width: min(520px, 76vw); display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #loading-emblem { width: 86px; height: 86px; border: 6px solid var(--gold); border-radius: 50%; display: grid; place-items: center; }
  #loading-emblem::before { content: ''; width: 34px; height: 34px; border: 6px solid var(--gold); border-top-color: transparent; border-radius: 50%; animation: loading-spin .9s linear infinite; }
  #loading-title { font-size: 30px; font-weight: 900; letter-spacing: .12em; text-align: center; }
  #loading-sub { font-size: 18px; font-weight: 800; letter-spacing: .1em; color: rgba(246,247,243,.72); text-align: center; }
  #loading-track { width: 100%; height: 18px; border: 3px solid rgba(246,247,243,.7); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.24); }
  #loading-progress { width: 12%; height: 100%; border-radius: inherit; background: var(--gold); animation: loading-progress 1.3s ease-in-out infinite; }
  #loading-status { font-size: 16px; font-weight: 800; letter-spacing: .08em; color: rgba(246,247,243,.66); }
  @keyframes loading-spin { to { transform: rotate(360deg); } }
  @keyframes loading-progress { 0% { width: 8%; transform: translateX(0); } 50% { width: 42%; transform: translateX(105%); } 100% { width: 8%; transform: translateX(1150%); } }

  .hud { position: absolute; pointer-events: none; }
  .hud button { pointer-events: auto; }

  /* ---- top ---- */
  #top-left { top: 28px; left: 28px; display: flex; flex-direction: column; gap: 10px; }
  /* The phase pill and the gold pill are deliberately built to the same
     numbers -- 34px type, a 32px disc, matching gap and padding -- so the two
     read as one family of readout sitting along the top edge rather than as two
     unrelated widgets that happen to share a corner. Change one, change both. */
  .badge {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.86); border-radius: 999px; padding: 10px 22px 10px 12px;
  }
  .badge .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--red); }
  /* line-height:1 on both, matching #gold-value. Without it the badge inherits
     `normal` and stands 12px taller than the gold pill on identical padding and
     type -- which is the sort of mismatch that reads as sloppy without being
     obvious enough to diagnose by eye. */
  .badge .label { font-size: 31px; line-height: 1; font-weight: 800; letter-spacing: .06em; color: #2a2a30; }
  .badge .sub { font-size: 31px; line-height: 1; font-weight: 700; color: #8a8a92; }
  /* The phase and wave readout is centred on the SCREEN, not inside a
     left-anchored column, so it needs a full-width row of its own to centre in.
     Spanning the width is safe: .hud is pointer-events:none and only its
     buttons take input back, so this cannot swallow clicks meant for the
     controls it now stretches across. */
  #top-centre {
    top: 28px; left: 0; right: 0;
    display: flex; justify-content: center;
  }
  #top-centre .badge .label,
  #top-centre .badge .sub { text-align: center; }
  #gold {
    position: absolute; top: 0; left: 0;
    display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
    background: rgba(255,255,255,.9); border-radius: 999px; padding: 10px 22px 10px 12px;
  }
  #gold .coin { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); }
  #gold-value { font-size: 31px; font-weight: 900; line-height: 1; color: #2a2a30; }

  #top-right { top: 28px; right: 28px; display: flex; flex-direction: column; gap: 10px; }
  .round {
    width: 56px; height: 56px; border: 0; border-radius: 18px;
    background: rgba(255,255,255,.86); color: #2a2a30;
    font-size: 44px; font-weight: 700; cursor: pointer; display: grid; place-items: center;
  }
  .round#btn-options { font-size: 38px; }
  .round#btn-zoom-in, .round#btn-zoom-out { font-size: 42px; }
  .round:hover { background: #fff; }
  .round.on { background: var(--gold); }

  /* ---- bottom ---- */
  #bottom {
    /* Keep the controls visible without the large translucent build-mode panel. */
    left: 0; right: 0; bottom: 0; padding: 0 28px 30px; min-height: 210px;
    background: transparent;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .bottom-panel-pop {
    transform-origin: center bottom;
    animation: bottom-panel-pop .34s cubic-bezier(.2,1.35,.42,1);
  }
  @keyframes bottom-panel-pop {
    from { opacity: 0; transform: translateY(34px) scale(.78); }
    62% { opacity: 1; transform: translateY(-5px) scale(1.045); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #build-panel { display: flex; gap: 14px; align-items: stretch; }
  .tower-button {
    flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center;
    background: #fff; border: 5px solid #000;
    border-radius: 22px; padding: 12px 8px; cursor: pointer; color: #000;
    font-family: inherit;
  }
  .tower-button:hover { background: #fff; }
  .tower-button.on {
    background: var(--gold); color: #000; border-color: #000;
    transform: translateY(3px);
    box-shadow: inset 0 5px 0 rgba(0,0,0,.14), 0 0 0 4px rgba(242,193,78,.3);
  }
  .tower-button.poor { opacity: .4; }
  /* The build-bar glyphs echo the silhouette grammar of TDD 5: the archer is a
     tower on legs, the barricade is a low slab. */
  .tower-button .glyph { width: 68px; height: 68px; }
  .tower-button .glyph-barricade { height: 32px !important; margin-top: 24px; }
  .glyph-archer { border: 4px solid #000; border-radius: 50%; }
  /* A keep: a solid block under three merlons. Two of the merlons are cast with
     box-shadow off the first, so the whole silhouette is one element. */
  .glyph-castle {
    position: relative; width: 44px; height: 30px;
    border: 5px solid #000; border-top: 0; border-radius: 0 0 4px 4px;
  }
  .glyph-castle::before {
    content: ''; position: absolute; left: -5px; top: -14px; width: 12px; height: 14px;
    background: #000;
    box-shadow: 17px 0 0 #000, 34px 0 0 #000;
  }
  .glyph-barricade { border: 7px solid #000; border-radius: 8px; height: 32px !important; margin-top: 24px; }
  .tower-button .name { font-size: 20px; font-weight: 900; letter-spacing: .03em; color: #000; }
  .tower-button .cost { font-size: 18px; font-weight: 900; opacity: 1; color: #000; }

  #btn-ready {
    flex: 0 0 190px; border: 5px solid #000; border-radius: 22px; cursor: pointer;
    background: #fff; color: #000; font-family: inherit;
    font-size: 24px; font-weight: 900; letter-spacing: .1em;
  }
  #btn-ready:hover { background: #fff; }

  /* ---- incoming wave (the build-phase telegraph) ----
     One badge per enemy type per landing. The triangle rides the rim and points
     at the shore that boat will come from -- and it is re-aimed every frame
     against the live camera yaw, because a compass that does not turn with the
     view is worse than no compass. */
  /* Anchored to the whole stage, not to a strip: each badge is placed on the
     screen EDGE in the direction its boat comes from, so the frame itself
     becomes the compass. Positions are written in stage pixels every frame. */
  /* ---- the placement confirm (TDD 16) ----
     A tap puts a ghost on the ground; this pops in above it, and pressing it is
     what actually spends the gold. The gap between choosing a spot and paying
     for it is the whole point -- on a phone the tap that picks the tile is also
     the tap most likely to be wrong, and there is no hover to check it with
     first. Anchored in the world rather than parked on the bottom bar so that
     what you are confirming is never in doubt. */
  #place-confirm { left: 0; top: 0; }
  #btn-confirm-place {
    position: absolute; left: -38px; top: -38px; width: 76px; height: 76px;
    border: 0; border-radius: 999px; padding: 0; cursor: pointer;
    background: var(--gold); box-shadow: 0 6px 18px rgba(8,16,19,.45);
    display: grid; place-items: center;
  }
  /* Drawn, not typed: a glyph would land differently on every device font. */
  #btn-confirm-place::before {
    content: ''; width: 27px; height: 15px; margin-top: -7px;
    border-left: 7px solid #22160a; border-bottom: 7px solid #22160a;
    border-radius: 2px; transform: rotate(-45deg);
  }
  #btn-confirm-place.pop { animation: confirm-pop .24s cubic-bezier(.2,1.5,.45,1); }
  #place-confirm-label {
    position: absolute; left: 50%; top: 42px; transform: translateX(-50%);
    min-width: 150px; padding: 7px 12px; border-radius: 999px;
    background: rgba(18,28,33,.92); border: 2px solid rgba(242,193,78,.9);
    color: #f6f7f3; text-align: center; white-space: nowrap;
    font-size: 19px; font-weight: 800; letter-spacing: .04em;
    text-shadow: 0 2px 6px rgba(0,0,0,.65);
  }
  @keyframes confirm-pop {
    from { transform: scale(.3); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* ---- placement rejection ----
     An invalid spot pops a short reason over the tile: enough to say WHY, brief
     enough to never sit on the screen. Anchored over the footprint like the
     confirm checkmark; the pill is centred on the tile and floats just above it. */
  #place-denied {
    left: 0; top: 0; display: grid; place-items: center;
    transform: translate(-50%, -100%); opacity: 0; z-index: 9;
  }
  #place-denied .pill {
    padding: 7px 16px; border-radius: 999px; white-space: nowrap;
    background: rgba(24,10,12,.92); border: 2px solid rgba(235,96,84,.92);
    color: #ffe9e7; text-align: center;
    font-size: 19px; font-weight: 900; letter-spacing: .06em;
    text-shadow: 0 2px 6px rgba(0,0,0,.7);
  }
  #place-denied.pop { animation: denied-pop 1.15s ease-out forwards; }
  @keyframes denied-pop {
    0%   { opacity: 0; transform: translate(-50%, -100%) translateY(9px) scale(.7); }
    14%  { opacity: 1; transform: translate(-50%, -100%) translateY(0) scale(1.06); }
    64%  { opacity: 1; transform: translate(-50%, -100%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -100%) translateY(-3px) scale(1); }
  }

  #wave-preview { inset: 0; }
  #wave-start-title {
    position: absolute; left: 0; right: 0; top: 30%;
    text-align: center; pointer-events: none; z-index: 8;
    color: #fff; font-size: 56px; font-weight: 1000; letter-spacing: .12em;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    opacity: 0; transform: translateY(-22px);
  }
  #wave-start-title.show { animation: wave-start-title 3.35s ease both; }
  @keyframes wave-start-title {
    0% { opacity: 0; transform: translateY(-22px); }
    12% { opacity: 1; transform: translateY(0); }
    75% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(22px); }
  }
  #wave-preview .label {
    position: absolute; left: 0; right: 0; top: 150px; text-align: center;
    font-size: 18px; font-weight: 900; letter-spacing: .18em;
    color: rgba(231,238,239,.62);
    text-shadow: 0 2px 10px rgba(8,16,19,.9);
  }
  .threat { position: absolute; width: 80px; height: 80px; animation: threat-bounce-in .5s cubic-bezier(.2,1.45,.4,1) both; }
  @keyframes threat-bounce-in {
    from { opacity: 0; transform: scale(.35) translateY(-20px); }
    65% { opacity: 1; transform: scale(1.12) translateY(4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  /* Fills the badge, so rotating it swings the triangle around the centre. */
  .threat-arrow { position: absolute; inset: 0; transform: rotate(0deg); }
  .threat-arrow::before {
    content: ''; position: absolute; left: 50%; top: -4px;
    margin-left: -9px; width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-bottom: 13px solid var(--gold);
  }
  .threat-body {
    position: absolute; inset: 7px; border-radius: 50%;
    background: rgba(18,28,33,.88); border: 2px solid rgba(242,193,78,.8);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: #e7eeef; box-shadow: 0 3px 14px rgba(8,16,19,.55);
  }
  .threat-count { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  /* The enemy glyphs echo the silhouette grammar of TDD 15: the grunt is the
     baseline dot, the archer is the same dot hollowed out, and the brute is
     bigger and squarer. Shape and size, never colour -- enemies are near-black
     by the hue rule and cannot be told apart by hue here either. */
  .eicon { width: 26px; height: 26px; flex: none; }
  .eicon-grunt { border-radius: 50%; background: #e7eeef; }
  .eicon-archer { border-radius: 50%; border: 6px solid #e7eeef; }
  .eicon-brute { width: 34px; height: 34px; border-radius: 8px; background: #e7eeef; }

  /* TDD 7: the upgrade panel. Replaces the build bar while a placed tower is
     selected, rather than sitting beside it -- the bottom third is the only
     thumb-reachable space there is, and two panels competing for it is how a
     phone UI stops being usable. */
  /* ---- the tower menu (TDD 7) ----
     A RADIAL ON THE BUILDING, not a panel at the bottom of the screen. The
     bottom strip is thumb-reachable, which is why the build bar lives there --
     but a tower menu has a subject, and putting it on the subject means the
     player never has to look away from the thing to read its options, or work
     out which of six towers the panel is talking about.

     Three seats, fixed: the two upgrades up-left and up-right, sell below. Fixed
     rather than distributed around the circle, so the same choice is always in
     the same place and the gesture becomes muscle memory. A tower with one
     upgrade leaves the second seat empty rather than re-centring the first. */
  #guide-click-here {
    display: none; position: absolute; z-index: 9;
    transform: translate(-50%, -100%);
    padding: 8px 16px; border-radius: 999px;
    background: #000; color: #fff; white-space: nowrap;
    font-size: 21px; font-weight: 900; letter-spacing: .08em;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
    pointer-events: none;
  }

  #tower-radial { left: 0; top: 0; display: none; }
  #tower-radial .radial-ring {
    position: absolute; left: -84px; top: -84px; width: 168px; height: 168px;
    border-radius: 50%; border: 3px solid rgba(255,255,255,.20);
    background: rgba(18,28,33,.34);
  }
  .radial-btn {
    position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px;
    border: 3px solid rgba(255,255,255,.30); border-radius: 50%;
    background: rgba(24,36,42,.94); color: #e7eeef; cursor: pointer;
    font-family: inherit; display: grid; place-items: center; gap: 1px;
    padding: 0; line-height: 1;
  }
  .radial-btn:hover { background: rgba(38,56,64,.97); border-color: rgba(255,255,255,.5); }
  .radial-btn.poor { opacity: .45; }
  /* TDD 5: WIDER means more projectiles, TALLER means more range and HP. The
     menu says which, so the silhouette grammar is taught rather than guessed. */
  .radial-btn .rb-shape { font-size: 15px; font-weight: 900; letter-spacing: .12em; color: var(--gold); }
  .radial-btn .rb-cost { font-size: 19px; font-weight: 900; }
  .radial-btn.radial-sell { border-color: rgba(214,73,66,.75); background: rgba(74,26,24,.94); }
  .radial-btn.radial-sell:hover { background: rgba(104,34,31,.97); }
  .radial-btn.radial-sell .rb-cost { color: var(--gold); }

  /* Seats. The two upgrades sit at +/-40 degrees above the horizontal and the
     sell button straight down, on an 88px radius. */
  #radial-opt-a { left: -67px; top: -57px; }
  #radial-opt-b { left:  67px; top: -57px; }
  #radial-sell  { left:   0px; top:  88px; }

  /* Opening pops; closing SHRINKS AWAY and only then is display:none applied,
     so a dismissed menu stops costing layout and paint entirely rather than
     lingering as an invisible-but-live subtree. */
  #tower-radial.opening { animation: radial-in .18s cubic-bezier(.2,1.5,.45,1); }
  #tower-radial.closing { animation: radial-out .14s ease-in forwards; }
  @keyframes radial-in {
    from { transform: scale(.35); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  @keyframes radial-out {
    from { transform: scale(1);   opacity: 1; }
    to   { transform: scale(.30); opacity: 0; }
  }

  #castle-prompt {
    display: none; flex-direction: column; gap: 6px; align-items: center;
    background: transparent; border: 0; border-radius: 0; padding: 18px 20px;
  }
  #castle-prompt .title {
    font-size: 30.5px; font-weight: 900; letter-spacing: .08em; color: var(--gold);
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  }
  #castle-prompt .sub { font-size: 22px; font-weight: 800; color: #000; }

  /* Siting the castle is ARMED, never automatic (TDD 4). Until this is pressed
     a tap means what it means everywhere else -- move the king -- so the very
     first thing a player does is walk around and look at the island. Once armed,
     the shared circular cancel control is the only bottom-bar action. */
  #btn-castle-mode {
    margin-top: 10px; width: 104px; height: 104px; border-radius: 999px;
    border: 5px solid #000; background: #fff;
    color: #000; cursor: pointer; display: grid; place-items: center;
    font-family: inherit;
    animation: castle-button-attention 3s ease-in-out infinite;
  }
  #btn-castle-mode:hover { background: #fff; }
  @keyframes castle-button-attention {
    0%, 60%, 100% {
      transform: translateY(0) scale(1);
      box-shadow: 0 0 0 0 rgba(242,193,78,0);
    }
    68% {
      transform: translateY(-12px) scale(1.12);
      box-shadow: 0 0 0 14px rgba(242,193,78,.38);
    }
    78% {
      transform: translateY(3px) scale(.97);
      box-shadow: 0 0 0 7px rgba(242,193,78,.22);
    }
    88% {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 0 0 3px rgba(242,193,78,.10);
    }
  }
  #btn-castle-mode.on {
    background: var(--gold); border-color: #000; color: #000;
    transform: translateY(3px);
    box-shadow: inset 0 6px 0 rgba(0,0,0,.14), 0 0 0 5px rgba(242,193,78,.3);
  }

  #place-cancel-panel { display: none; justify-content: center; align-items: center; }
  #btn-cancel-place {
    position: relative; width: 104px; height: 104px; border-radius: 999px;
    border: 5px solid #000; background: #fff; cursor: pointer;
    box-shadow: 0 8px 22px rgba(8,16,19,.38);
  }
  #btn-cancel-place::before, #btn-cancel-place::after {
    content: ''; position: absolute; left: 23px; top: 45px;
    width: 48px; height: 7px; border-radius: 4px; background: #000;
  }
  #btn-cancel-place::before { transform: rotate(45deg); }
  #btn-cancel-place::after { transform: rotate(-45deg); }
  #btn-cancel-place:active { transform: translateY(3px); background: var(--gold); }

  /* ---- options ----
     Opening it PAUSES. The pause button it replaced was the only way to stop
     the game, and TDD 14 is explicit that mobile players get interrupted, so
     the pause had to survive the button being taken away. */
  #options-panel {
    position: absolute; inset: 0; display: none; place-items: center;
    background: rgba(12,20,23,.78); pointer-events: auto;
  }
  #options-card {
    width: 460px; background: #1b282e; border-radius: 26px; padding: 34px 36px 30px;
    display: flex; flex-direction: column; gap: 22px;
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  #options-card h2 {
    margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .16em;
    color: var(--gold); text-align: center;
  }
  .opt-row { display: flex; flex-direction: column; gap: 10px; }
  .opt-row .head { display: flex; justify-content: space-between; align-items: baseline; }
  .opt-row .name {
    font-size: 15px; font-weight: 700; letter-spacing: .08em; color: #e7eeef;
  }
  .opt-row .value { font-size: 15px; font-weight: 700; color: rgba(231,238,239,.6); }
  .opt-row input[type=range] {
    width: 100%; height: 30px; accent-color: var(--gold); cursor: pointer;
  }
  #btn-close-options {
    border: 0; border-radius: 18px; padding: 15px; cursor: pointer;
    background: var(--gold); color: #1a1206;
    font-family: inherit; font-size: 16px; font-weight: 800; letter-spacing: .1em;
  }

  /* ---- game over ---- */
  #over-panel {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(12,20,23,.82); pointer-events: auto;
  }
  #over-title { font-size: 42px; font-weight: 900; letter-spacing: .08em; color: #f6f7f3; }
  #over-panel button {
    width: 300px; padding: 16px; border: 0; border-radius: 18px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: .06em;
  }
  #btn-restart-wave { background: var(--gold); color: #1a1206; }
  #btn-next-level { background: var(--gold); color: #1a1206; }
  #btn-restart-level { background: rgba(255,255,255,.12); color: #e7eeef; }
  /* The level name sits under the phase badge, tighter than a phase chip. */
  #level-badge { padding: 5px 16px 5px 16px; align-self: flex-start; }
  #level-badge .label { font-size: 15px; letter-spacing: .04em; }

  /* ---- dev overlay ---- */
  #dev {
    position: absolute; top: 0; left: 0; min-width: 230px;
    font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #cfe3e8; background: rgba(8,16,19,.82);
    padding: 10px 12px; border-bottom-right-radius: 12px; pointer-events: auto;
  }
  #dev.hidden > *:not(#dev-toggle) { display: none; }
  #dev-toggle { background: none; border: 0; color: var(--gold); cursor: pointer;
    font: inherit; font-weight: 700; padding: 0; letter-spacing: .1em; }
  #dev-stats { margin: 8px 0; white-space: pre; }
  #dev .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #dev .row span { width: 60px; color: #8fa9b0; }
  #dev input[type=range] { flex: 1; height: 14px; }
  #dev .toggles { display: flex; gap: 6px; margin-top: 8px; }
  #dev .toggles button { font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    border: 1px solid rgba(207,227,232,.28); background: transparent; color: #cfe3e8; }
  #dev .toggles button.on { background: var(--gold); color: #1a1206; border-color: var(--gold); }

  #fatal { position: absolute; inset: 0; z-index: 30; display: none; place-items: center;
    background: #160f10; color: #ffb4ac; padding: 40px;
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="./src/ui/theme.css">
</head>
<body>

<div id="stage">
  <div id="viewport"></div>

  <div id="loading" role="status" aria-live="polite">
    <div id="loading-mark">
      <div id="loading-emblem" aria-hidden="true"></div>
      <div id="loading-title">KING'S LANDING</div>
      <div id="loading-sub">PREPARING THE ISLAND</div>
      <div id="loading-track" role="progressbar" aria-label="Loading game">
        <div id="loading-progress"></div>
      </div>
      <div id="loading-status">LOADING...</div>
    </div>
  </div>

  <div class="hud" id="top-centre">
    <div class="badge">
      <div class="dot"></div>
      <div class="label" id="phase-label">BUILD</div>
      <div class="sub" id="phase-sub">1 / 6</div>
    </div>
  </div>

  <div class="hud" id="top-left">
    <div id="gold"><div class="coin"></div><div id="gold-value">0</div></div>
  </div>

  <div class="hud" id="top-right">
    <button class="round" id="btn-options" title="Options">&#9881;</button>
    <button class="round" id="btn-rotate" title="Rotate">&#8635;</button>
    <button class="round" id="btn-zoom-in" title="Zoom in">+</button>
    <button class="round" id="btn-zoom-out" title="Zoom out">&#8211;</button>
  </div>

  <div class="hud" id="wave-preview"></div>
  <div id="wave-start-title" aria-live="polite"></div>

  <!-- Anchored to the structure, positioned every frame from hud.js. Scaling
       happens on this element, so the seats scale with it as one piece. -->
  <div class="hud" id="guide-click-here">CLICK HERE</div>

  <div class="hud" id="tower-radial">
    <div class="radial-ring"></div>
    <button class="radial-btn" id="radial-opt-a"></button>
    <button class="radial-btn" id="radial-opt-b"></button>
    <button class="radial-btn radial-sell" id="radial-sell"></button>
  </div>

  <div class="hud" id="place-confirm" style="display:none">
    <button id="btn-confirm-place" aria-label="Confirm placement"></button>
    <div id="place-confirm-label"></div>
  </div>

  <div class="hud" id="place-denied" role="status" aria-live="polite">
    <div class="pill" id="place-denied-text"></div>
  </div>

  <div class="hud" id="bottom">
    <div id="build-panel">
      <button class="tower-button" data-build="archer" aria-pressed="false">
        <img class="build-icon" src="./src/ui/archer.svg" alt="" width="100" height="104">
        <div class="name">Archer Tower</div>
        <div class="cost">15 gold</div>
      </button>
      <button class="tower-button" data-build="barricade" aria-pressed="false">
        <img class="build-icon" src="./src/ui/barricade.svg" alt="" width="100" height="104">
        <div class="name">Barricade</div>
        <div class="cost">10 gold</div>
      </button>
      <button id="btn-ready">READY</button>
    </div>


    <div id="place-cancel-panel">
      <button id="btn-cancel-place" aria-label="Cancel building placement"></button>
    </div>

    <div id="castle-prompt">
      <div class="title">PLACE YOUR CASTLE</div>
      <div class="sub" id="castle-hint">Castles require a flat 2&times;2 area</div>
      <button id="btn-castle-mode" aria-label="Place the castle">
        <div class="glyph-castle"></div>
      </button>
    </div>
  </div>

  <div id="options-panel">
    <div id="options-card">
      <h2>OPTIONS</h2>
      <div class="opt-row">
        <div class="head">
          <span class="name">SOUND</span>
          <span class="value" id="volume-value">100%</span>
        </div>
        <input type="range" id="opt-volume" min="0" max="100" step="1" value="100">
      </div>
      <button id="btn-close-options">RESUME</button>
    </div>
  </div>

  <div id="over-panel">
    <div id="over-title">THE ISLAND FELL</div>
    <button id="btn-next-level">NEXT ISLAND</button>
    <button id="btn-restart-wave">RESTART WAVE</button>
    <button id="btn-restart-level">RESTART LEVEL</button>
  </div>

  <div id="dev" class="hidden">
    <button id="dev-toggle">DEV</button>
    <div id="dev-stats">booting</div>
    <div class="row"><span>sat</span><input type="range" id="g-sat" min="0.6" max="1.6" step="0.02"></div>
    <div class="row"><span>contrast</span><input type="range" id="g-con" min="0.85" max="1.35" step="0.01"></div>
    <div class="row"><span>vignette</span><input type="range" id="g-vig" min="0" max="1" step="0.05"></div>
    <div class="toggles"><button id="t-grid">grid</button></div>
  </div>

  <div id="fatal"></div>
</div>

<script type="module">
  import { boot } from './src/main.js';
  boot().catch(error => {
    const box = document.getElementById('fatal');
    box.style.display = 'grid';
    box.textContent = (error && error.stack) || String(error);
    console.error(error);
  });
</script>
</body>
</html>
