<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 19 76 81">
<!-- The in-game keep: pale stone block between two roofed towers. Colours are
     the scene's own, P.wall for the stone, castleBlue #607f91 for the slate and
     castleGold #d2ad55 for the finials. Lit like the other two build icons,
     with top faces lightest and right faces shaded.
     NOTE: no double hyphen anywhere in these comments. SVG is XML, and one
     silently turns the whole file into a parse error. -->
<defs>
  <g id="tower">
    <!-- Shaft, drawn about its own centre so both towers are one shape. -->
    <path d="M-10 -4 0 -1 0 39-10 36z" fill="#f1eee2"/>
    <path d="M0 -1 10 -4 10 36 0 39z" fill="#d6d0b8"/>
    <path d="M0 -7 10 -4 0 -1-10 -4z" fill="#f7f4ea"/>
    <!-- Pyramid roof: two visible faces meeting above the front corner. -->
    <path d="M-10 -4 0 -1 0-24z" fill="#6d8ea0"/>
    <path d="M0 -1 10 -4 0-24z" fill="#56717f"/>
    <circle cx="0" cy="-26" r="3" fill="#d2ad55"/>
  </g>
</defs>
<use href="#tower" x="24" y="50"/>
<use href="#tower" x="76" y="50"/>
<!-- The keep stands in front of both towers, so it is drawn last. -->
<path d="M30 64 50 70 50 98 30 92z" fill="#f1eee2"/>
<path d="M50 70 70 64 70 92 50 98z" fill="#d6d0b8"/>
<path d="M50 58 70 64 50 70 30 64z" fill="#f7f4ea"/>
<!-- Door, skewed to sit flat on the left face. -->
<path d="M40 81 45 82.5 45 96 40 94.5z" fill="#6b5942"/>
</svg>
